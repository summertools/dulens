[package]
name = "dulens"
version = "0.1.0"
edition = "2024"
description = "A polished, interactive disk-usage explorer for the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
globset = "0.4.20"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
